name: Fuzz

# ClusterFuzzLite: builds the Atheris targets in backend/fuzz/ with the same
# OSS-Fuzz toolchain (.clusterfuzzlite/) and fuzzes them for a few minutes on
# every PR touching the backend — code-change mode, so a regression in the
# path boundary, the merge core or the origin guard fails the PR. Continuous
# fuzzing with a persisted corpus is OSS-Fuzz's job once the project is
# onboarded (see backend/fuzz/README.md).

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:

permissions: read-all

jobs:
  fuzz:
    if: github.head_ref != 'demo' && !startsWith(github.head_ref, 'demo/')
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: code-change
          sanitizer: address
