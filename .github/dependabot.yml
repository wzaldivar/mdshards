# Keep the SHA-pinned actions current. Dependabot understands the
# `@<sha> # vX.Y.Z` form and bumps both the SHA and the comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor/patch bumps arrive as one PR; a major bump stays its own PR
      # so breaking changes get reviewed individually.
      actions-minor-patch:
        update-types: [minor, patch]
